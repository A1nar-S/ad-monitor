# Everything goes to Discord. One message per alertname (and job/topic, so two services down or two
# topics with dead letters read separately); severity is in each alert's line.
apiVersion: 1
policies:
  - orgId: 1
    receiver: discord
    group_by: [alertname, job, topic]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
