# Scrapes the services' /metrics (METRICS_ADDR, :9100) over the compose
# network. Metric names are listed in docs/PROJECT_NOTES.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: scraper
    static_configs: [{targets: ["scraper:9100"]}]
  - job_name: ingest
    static_configs: [{targets: ["ingest:9100"]}]
  - job_name: matcher
    static_configs: [{targets: ["matcher:9100"]}]
  - job_name: notifier
    static_configs: [{targets: ["notifier:9100"]}]
  - job_name: bot
    static_configs: [{targets: ["bot:9100"]}]
  - job_name: api
    static_configs: [{targets: ["api:9100"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  # --- container metrics (cAdvisor) and Grafana ---
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
  - job_name: cadvisor
    # Matches cAdvisor's 30 s housekeeping: scraping faster only repeats values.
    scrape_interval: 30s
    static_configs: [{targets: ["cadvisor:8080"]}]
    metric_relabel_configs:
      # Only the families infra/grafana/dashboards/containers.json uses; add a
      # name here when a panel needs another one.
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|spec_memory_limit_bytes|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total|start_time_seconds|scrape_error)
        action: keep
      # Series without a container name (not a Docker container): drop. Not
      # container_scrape_error, which never has one (RE2 has no lookahead).
      - source_labels: [__name__, name]
        regex: container_(cpu|memory|spec|network|fs|start)_.*;
        action: drop
      # `id` is the cgroup path with the container hash; `name` identifies it.
      - regex: id
        action: labeldrop

  # Postgres and Kafka exporters (infra/grafana/dashboards/postgres-kafka.json).
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
    # The exporter emits ~250 pg_settings_* series and many per-table families;
    # keep only what the dashboard reads (max_connections, table sizes and rows).
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: pg_settings_max_connections
        target_label: __keep
        replacement: "1"
      # Joined with ";": an empty __keep leaves "pg_settings_...;".
      - source_labels: [__name__, __keep]
        regex: pg_settings_.*;
        action: drop
      - regex: __keep
        action: labeldrop
      - source_labels: [__name__]
        regex: pg_statio_user_tables_.*|pg_locks_count|pg_database_connection_limit|pg_stat_user_tables_(seq_.*|idx_.*|n_tup_.*|n_mod_since_analyze|.*vacuum.*|.*analyze.*)
        action: drop
  - job_name: kafka
    static_configs: [{targets: ["kafka-exporter:9308"]}]
    metric_relabel_configs:
      # Per-member and per-group detail the dashboard does not use; lag, offsets and brokers are kept.
      - source_labels: [__name__]
        regex: kafka_consumergroup_(members|current_offset_sum)|kafka_topic_partition_(replicas|in_sync_replica|leader|leader_is_preferred|under_replicated_partition)
        action: drop
