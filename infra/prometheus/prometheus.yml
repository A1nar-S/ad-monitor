# Scrapes the services' /metrics (METRICS_ADDR, :9100) over the compose
# network. Metric names are listed in docs/PROJECT_NOTES.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: scraper
    static_configs: [{targets: ["scraper:9100"]}]
  - job_name: ingest
    static_configs: [{targets: ["ingest:9100"]}]
  - job_name: matcher
    static_configs: [{targets: ["matcher:9100"]}]
  - job_name: notifier
    static_configs: [{targets: ["notifier:9100"]}]
  - job_name: bot
    static_configs: [{targets: ["bot:9100"]}]
  - job_name: api
    static_configs: [{targets: ["api:9100"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
