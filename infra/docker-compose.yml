# One env file for everything: the repo-root .env (see .env.example).
#
#   docker compose --env-file .env -f infra/docker-compose.yml up -d                      # Postgres + Kafka only
#   docker compose --env-file .env -f infra/docker-compose.yml --profile app up -d --build # + the services
#
# `make up` / `make infra` in the repo root run exactly these. Searches are
# made by users through the bot and the dashboard; there is no config file.
x-service: &service
  build:
    context: ..
  restart: unless-stopped
  profiles: [app]
  env_file:
    - path: ../.env
      required: false
  environment:
    # Inside the compose network, not localhost.
    DB_HOST: postgres
    DB_PORT: "5432"
    KAFKA_BROKERS: kafka:29092
    # /metrics for Prometheus; reachable on the compose network only (no
    # ports: entry publishes it to the host).
    METRICS_ADDR: ":9100"
  depends_on:
    postgres: {condition: service_healthy}
    kafka-init: {condition: service_completed_successfully}

services:
  kafka:
    image: confluentinc/cp-kafka:8.4.1
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092" # EXTERNAL listener, for services run on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL is what containers reach (advertised as kafka:29092); EXTERNAL
      # is advertised as localhost so host-side tools work too.
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: QmZ1MHJhQW5JaUNkWHlWZQ==
      # Single broker: the defaults of 3 would leave consumer groups unusable.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Plenty for a laptop; the default heap is sized for a server.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      # The image runs as uid 1000. A bind mount, or a volume on a path the image
      # lacks, is created root-owned and Kafka cannot write meta.properties there.
      # A named volume on the image's own data dir inherits the right owner.
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topics with explicit partition counts (auto-creation would give 1),
  # and a dead-letter topic <topic>.dlq for each: records a consumer gave up on,
  # kept 30 days (see `make dlq`). With NAMESPACE set, services use <ns>.<topic>
  # and the namespaced .dlq topic is auto-created (1 partition).
  kafka-init:
    image: confluentinc/cp-kafka:8.4.1
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in listings.discovered listings.new listings.details gems.scan_requested notifications.requested; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000
        done

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env (make env)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (make env)}
      POSTGRES_DB: ${DB_NAME:-ads_monitor}
    volumes:
      # Named volume: a bind mount ends up root-owned on Linux and breaks
      # `go test ./...` / builds that walk the repo.
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  scraper:
    <<: *service
    build: {context: .., args: {CMD: scraper}}
  ingest:
    <<: *service
    build: {context: .., args: {CMD: ingest}}
  matcher:
    <<: *service
    build: {context: .., args: {CMD: matcher}}
  notifier:
    <<: *service
    build: {context: .., args: {CMD: notifier}}
  # The dashboard, the chat bot people manage their searches with (/watch,
  # /searches, /dashboard) and the price watches. Bound to this machine only;
  # publish it with a tunnel (PUBLIC_URL in .env) if others should reach it.
  api:
    <<: *service
    build: {context: .., args: {CMD: api}}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BROKERS: kafka:29092
      API_ADDR: 0.0.0.0:8080
      METRICS_ADDR: ":9100"
    ports:
      - "127.0.0.1:8080:8080"
  # Scrapes every service's /metrics (infra/prometheus/prometheus.yml). The UI
  # is bound to this machine only: http://127.0.0.1:9090
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    profiles: [app]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # The directory, not the file: an edited prometheus.yml (new inode) stays visible
      # to the container, so `make up` can reload it with SIGHUP.
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
  # Dashboards, provisioned from infra/grafana (datasource + JSON files): http://127.0.0.1:3000,
  # login admin / GRAFANA_ADMIN_PASSWORD. Bound to this machine only.
  grafana:
    image: grafana/grafana-oss:11.6.0
    restart: unless-stopped
    profiles: [app]
    depends_on: [prometheus]
    # Refuse to start without a password (never a default). Checked here, not
    # with ${VAR:?} in the file, which would break every compose command for a
    # .env that predates this variable.
    # Also: Grafana refuses to provision a Discord contact point with an empty URL, so an unset
    # GRAFANA_DISCORD_WEBHOOK_URL becomes an unreachable placeholder (alerts stay visible in the UI;
    # sending fails and is logged).
    entrypoint:
      - sh
      - -c
      - |
        : "$${GF_SECURITY_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (make env)}"
        if [ -z "$$GRAFANA_DISCORD_WEBHOOK_URL" ]; then
          export GRAFANA_DISCORD_WEBHOOK_URL=http://127.0.0.1:9/discord-webhook-not-configured
          echo "notice: GRAFANA_DISCORD_WEBHOOK_URL is not set; alerts show in Grafana only" >&2
        fi
        exec /run.sh
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # No plugin downloads on start (the dashboards use built-in panels only).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # /metrics for Prometheus; compose network only.
      GF_METRICS_ENABLED: "true"
      # Base of the dashboard links in alert messages.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
      GRAFANA_DISCORD_WEBHOOK_URL: ${GRAFANA_DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
  # --- container metrics (cAdvisor) ---
  # Per-container CPU, memory, network and disk for Prometheus. Not published to
  # the host (no ports:); Prometheus reads cadvisor:8080 on the compose network.
  # Cardinality and CPU are kept low: Docker containers only, 30 s housekeeping,
  # the expensive metric groups off, and only the compose labels kept.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    profiles: [app]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=30s
      - --allow_dynamic_housekeeping=false
      - --disable_root_cgroup_stats=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=advtcp,cpu_topology,cpuset,cpuLoad,hugetlb,memory_numa,percpu,perf_event,pressure,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/containerd:/var/run/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  # --- Postgres and Kafka exporters (metrics for the Postgres & Kafka dashboard) ---
  # Creates (or updates) the least-privilege role the exporter logs in with:
  # LOGIN + pg_monitor only, never the app's owner account. Idempotent, so it runs
  # on every `up`: fresh and existing databases alike, and it applies a changed
  # MONITOR_DB_PASSWORD. Without that variable (a .env that predates it) it only
  # warns and exits 0, so `up` still succeeds; the exporter then cannot log in and
  # pg_up shows 0. (No ${VAR:?} in the file: it would break every compose command.)
  # The password goes in by \getenv, not argv, and statement logging is off for it.
  pg-monitor-init:
    image: postgres:15
    profiles: [app]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-}
      PGPASSWORD: ${DB_PASSWORD:-}
      PGDATABASE: ${DB_NAME:-ads_monitor}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:-}
    entrypoint: ["bash", "-c"]
    command:
      - |
        if [ -z "$$MONITOR_DB_PASSWORD" ]; then
          echo "WARNING: MONITOR_DB_PASSWORD is not set in .env (make env); skipping the monitoring role. The Postgres exporter cannot log in and pg_up will read 0." >&2
          exit 0
        fi
        psql -v ON_ERROR_STOP=1 <<'SQL'
        \getenv pw MONITOR_DB_PASSWORD
        SET log_statement = 'none';
        SET log_min_duration_statement = -1;
        SET log_min_error_statement = 'panic';
        SELECT 'CREATE ROLE admon_monitor LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'admon_monitor') \gexec
        ALTER ROLE admon_monitor LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE CONNECTION LIMIT 3 PASSWORD :'pw';
        GRANT pg_monitor TO admon_monitor;
        SQL
  # Postgres metrics for Prometheus (job postgres), compose network only.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    restart: unless-stopped
    profiles: [app]
    depends_on:
      pg-monitor-init: {condition: service_completed_successfully}
    environment:
      DATA_SOURCE_URI: postgres:5432/${DB_NAME:-ads_monitor}?sslmode=disable
      DATA_SOURCE_USER: admon_monitor
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD:-}
  # Kafka topic offsets and consumer-group lag for Prometheus (job kafka), compose network only.
  # It reads every topic and group, so a NAMESPACE prefix needs no setting here;
  # the dashboard matches names by suffix.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    restart: unless-stopped
    profiles: [app]
    depends_on:
      kafka: {condition: service_healthy}
    command:
      - --kafka.server=kafka:29092
      # Not __consumer_offsets and other internal topics.
      - --topic.filter=^[^_]
  # One-off maintenance: `make purge`, or `... --profile tools run --rm admin migrate`.
  admin:
    <<: *service
    profiles: [tools]
    restart: "no"
    build: {context: .., args: {CMD: admin}}
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

volumes:
  kafka-data:
  pg-data:
  prometheus-data:
  grafana-data:
