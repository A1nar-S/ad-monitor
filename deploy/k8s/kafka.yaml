# Single-node Kafka in KRaft mode, like infra/docker-compose.yml, reachable
# in the cluster as kafka:29092 only.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  selector: {app: kafka}
  ports:
    - {name: kafka, port: 29092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      # Kubernetes would inject KAFKA_PORT=tcp://... for the Service, and the
      # Confluent image turns every KAFKA_* variable into broker config.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            # The pod cannot bind the Service name (it resolves to itself only
            # through DNS), so listen on all interfaces and advertise the name.
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:29092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:29092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: CLUSTER_ID, value: "QmZ1MHJhQW5JaUNkWHlWZQ=="}
            # Single broker: the defaults of 3 would leave consumer groups unusable.
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          ports:
            - {name: kafka, containerPort: 29092}
          readinessProbe:
            tcpSocket: {port: 29092}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
---
# Creates the topics with explicit partition counts and a <topic>.dlq for each
# (see kafka-init in infra/docker-compose.yml). Idempotent; it retries until
# Kafka is up, and is removed after a while so the next apply runs it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 600
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: confluentinc/cp-kafka:7.5.0
          command: ["bash", "-ec"]
          args:
            - |
              for t in listings.discovered listings.new notifications.requested; do
                kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $t --partitions 3 --replication-factor 1
                kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $t.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000
              done
