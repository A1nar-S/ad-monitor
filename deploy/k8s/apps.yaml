# The services, one Deployment each. What they share (config, waiting for
# Postgres and the Kafka topics, the locked-down container) is in
# app-common.yaml, patched onto every Deployment labelled tier=app.
#
# The admon/<cmd> image names are rewritten by the images list in
# kustomization.yaml: GHCR digests after a release, :local imports before.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scraper
  labels: {tier: app}
spec:
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: scraper}
  template:
    metadata:
      labels: {app: scraper}
    spec:
      containers:
        - name: app
          image: admon/scraper:local
          # A gem scan holds a whole category in memory. Go collects only
          # once the heap doubles, which reached the 512Mi limit
          # (app-common.yaml) and got the scraper OOM-killed; this makes it
          # collect harder before then instead.
          env:
            - {name: GOMEMLIMIT, value: 400MiB}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels: {tier: app}
spec:
  selector:
    matchLabels: {app: ingest}
  template:
    metadata:
      labels: {app: ingest}
    spec:
      containers:
        - {name: app, image: admon/ingest:local}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher
  labels: {tier: app}
spec:
  selector:
    matchLabels: {app: matcher}
  template:
    metadata:
      labels: {app: matcher}
    spec:
      containers:
        - {name: app, image: admon/matcher:local}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  labels: {tier: app}
spec:
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: notifier}
  template:
    metadata:
      labels: {app: notifier}
    spec:
      containers:
        - {name: app, image: admon/notifier:local}
---
# The dashboard, the chat bot and the price watches: the only thing
# cloudflared forwards to. Recreate here and for scraper and notifier: two
# copies side by side during an update would answer, scrape or send twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {tier: app}
spec:
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: app
          image: admon/api:local
          env:
            - {name: API_ADDR, value: "0.0.0.0:8080"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 8080, targetPort: http}
