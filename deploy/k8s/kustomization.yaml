# The whole app on one k3s node (see deploy/README.md). Flux applies it from
# main (deploy/flux); by hand: deploy/k3s.sh images && deploy/k3s.sh apply.
# Only the dashboard (Service api) is public, through the Cloudflare tunnel.
# Postgres, Kafka and every /metrics stay inside the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: admon
resources:
  - namespace.yaml
  - postgres.yaml
  - kafka.yaml
  - apps.yaml
  - purge.yaml
  - cloudflared.yaml
  - exporters.yaml
patches:
  - path: app-common.yaml
    target:
      kind: Deployment
      labelSelector: tier=app
# Which build runs. The Release workflow (.github/workflows/release.yml) sets
# newName and digest here for every service when a v* tag is pushed; :local
# is the k3s.sh images import, used until the first release.
images:
  - {name: admon/scraper, newName: ghcr.io/a1nar-s/advertisiment-monitoring/scraper, digest: 'sha256:dd34215d1ecc0baf2344699cbb51ce83e09ad2a2752ca9474fb6f05cc93c6fd4'}
  - {name: admon/ingest, newName: ghcr.io/a1nar-s/advertisiment-monitoring/ingest, digest: 'sha256:b905f0edfb05a8a20e9a07c8cd5b4379c3badeeedc2750fd77df439011113b9e'}
  - {name: admon/matcher, newName: ghcr.io/a1nar-s/advertisiment-monitoring/matcher, digest: 'sha256:fd629f11cd97f3aab7daee0a38608bf5f149558e9cb6f81f6f7deffc66b76871'}
  - {name: admon/notifier, newName: ghcr.io/a1nar-s/advertisiment-monitoring/notifier, digest: 'sha256:702168be13b0b3c17d4acb3724ae62e8f3b2b042040d49b2e7540669a5455c52'}
  - {name: admon/api, newName: ghcr.io/a1nar-s/advertisiment-monitoring/api, digest: 'sha256:352edf8b4601b3151a712944d7e9764f6bc071d49a1c5f2d4ae803f02057ee08'}
  - {name: admon/admin, newName: ghcr.io/a1nar-s/advertisiment-monitoring/admin, digest: 'sha256:b9c624303b4930e5ff58d26d764cb112964a58c68eeaf47b8099c8d06baa25a4'}
