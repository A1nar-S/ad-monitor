# The whole app on one k3s node (see deploy/README.md). Flux applies it from
# main (deploy/flux); by hand: deploy/k3s.sh images && deploy/k3s.sh apply.
# Only the dashboard (Service api) is public, through the Cloudflare tunnel.
# Postgres, Kafka and every /metrics stay inside the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: admon
resources:
  - namespace.yaml
  - postgres.yaml
  - kafka.yaml
  - apps.yaml
  - purge.yaml
  - cloudflared.yaml
  - exporters.yaml
patches:
  - path: app-common.yaml
    target:
      kind: Deployment
      labelSelector: tier=app
# Which build runs. The Release workflow (.github/workflows/release.yml) sets
# newName and digest here for every service when a v* tag is pushed; :local
# is the k3s.sh images import, used until the first release.
images:
  - {name: admon/scraper, newName: ghcr.io/a1nar-s/advertisiment-monitoring/scraper, digest: 'sha256:9cfd44809041d22f49e682fd1873411d0b6f57f25d5e7b0b74bbcc34ccff1756'}
  - {name: admon/ingest, newName: ghcr.io/a1nar-s/advertisiment-monitoring/ingest, digest: 'sha256:8208f20d07541f2f52c9e1444bc27a904e942a09207cfeefe580293ad1da865b'}
  - {name: admon/matcher, newName: ghcr.io/a1nar-s/advertisiment-monitoring/matcher, digest: 'sha256:2f04115a59badf878a78f2405ccaad75890e9560c60e2ac182e07f32a076bba4'}
  - {name: admon/notifier, newName: ghcr.io/a1nar-s/advertisiment-monitoring/notifier, digest: 'sha256:41cd3d9fd5f9a6956b20593c650a101912e23831dabfd94ff920b5d7929790e9'}
  - {name: admon/bot, newName: ghcr.io/a1nar-s/advertisiment-monitoring/bot, digest: 'sha256:258e5af249ac0822e501f7d85dfac3744343b6c2af16acbaf32d7cd5cbab601a'}
  - {name: admon/api, newName: ghcr.io/a1nar-s/advertisiment-monitoring/api, digest: 'sha256:9ad2bfac002fa2924e6d82b20e823f0cbf3adcd6a7f51834480efda7028b8933'}
  - {name: admon/admin, newName: ghcr.io/a1nar-s/advertisiment-monitoring/admin, digest: 'sha256:a90174cdc5a168dbfcb75626ad1d9efea8ffee1bc6f7e322d06e0d7314c1b53e'}
