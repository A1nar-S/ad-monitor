# The whole app on one k3s node (see deploy/README.md). Flux applies it from
# main (deploy/flux); by hand: deploy/k3s.sh images && deploy/k3s.sh apply.
# Only the dashboard (Service api) is public, through the Cloudflare tunnel.
# Postgres, Kafka and every /metrics stay inside the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: admon
resources:
  - namespace.yaml
  - postgres.yaml
  - kafka.yaml
  - apps.yaml
  - purge.yaml
  - cloudflared.yaml
  - exporters.yaml
patches:
  - path: app-common.yaml
    target:
      kind: Deployment
      labelSelector: tier=app
# Which build runs. The Release workflow (.github/workflows/release.yml) sets
# newName and digest here for every service when a v* tag is pushed; :local
# is the k3s.sh images import, used until the first release.
images:
  - {name: admon/scraper, newName: ghcr.io/a1nar-s/advertisiment-monitoring/scraper, digest: 'sha256:74fc973fd14d8d6009b1eb2a266ae1f2e6b2db04f8bd3a38b18a43fcc9d94a0e'}
  - {name: admon/ingest, newName: ghcr.io/a1nar-s/advertisiment-monitoring/ingest, digest: 'sha256:d815ba67790055b3b44e040c35ca5904536610f3490d3984670e512afa168e43'}
  - {name: admon/matcher, newName: ghcr.io/a1nar-s/advertisiment-monitoring/matcher, digest: 'sha256:3294b891c422fc14ead25934d93b1f993f9f94fe703b125524149e4661e47571'}
  - {name: admon/notifier, newName: ghcr.io/a1nar-s/advertisiment-monitoring/notifier, digest: 'sha256:86ca9bb57bfc47a289f5f6db133276d517a6ced78aff5529e653a89e8feb5673'}
  - {name: admon/bot, newName: ghcr.io/a1nar-s/advertisiment-monitoring/bot, digest: 'sha256:a309d6884dc01506e7d92dcacebfaa92f4ff71cc4478183c76ea0d8b5f1340a2'}
  - {name: admon/api, newName: ghcr.io/a1nar-s/advertisiment-monitoring/api, digest: 'sha256:895a877f381064e7bd5748ece2d5df34ad0523bfc70c922393be948d5449cc92'}
  - {name: admon/admin, newName: ghcr.io/a1nar-s/advertisiment-monitoring/admin, digest: 'sha256:50d40fadd65dfd3778f63c16f0dd4f7c5055f50ea75e861b211d7262ea430d11'}
