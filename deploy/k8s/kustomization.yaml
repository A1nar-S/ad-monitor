# The whole app on one k3s node (see deploy/README.md). Flux applies it from
# main (deploy/flux); by hand: deploy/k3s.sh images && deploy/k3s.sh apply.
# Only the dashboard (Service api) is public, through the Cloudflare tunnel.
# Postgres, Kafka and every /metrics stay inside the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: admon
resources:
  - namespace.yaml
  - postgres.yaml
  - kafka.yaml
  - apps.yaml
  - purge.yaml
  - cloudflared.yaml
  - exporters.yaml
patches:
  - path: app-common.yaml
    target:
      kind: Deployment
      labelSelector: tier=app
# Which build runs. The Release workflow (.github/workflows/release.yml) sets
# newName and digest here for every service when a v* tag is pushed; :local
# is the k3s.sh images import, used until the first release.
images:
  - {name: admon/scraper, newName: ghcr.io/a1nar-s/advertisiment-monitoring/scraper, digest: 'sha256:bc845ae25a7d30ed0a646dbe77d0fbe84c68bd92254a719accdbeaeaf28ce9e7'}
  - {name: admon/ingest, newName: ghcr.io/a1nar-s/advertisiment-monitoring/ingest, digest: 'sha256:2e031b19f463da5b294d9ec735244aaf46d302c9bdc12d256070a945d147e54e'}
  - {name: admon/matcher, newName: ghcr.io/a1nar-s/advertisiment-monitoring/matcher, digest: 'sha256:a24a6f2cd0668500addfdbc23c3ae448af00a1e64a95a42ab24fd15e5ee2aae6'}
  - {name: admon/notifier, newName: ghcr.io/a1nar-s/advertisiment-monitoring/notifier, digest: 'sha256:1dca1a06f82c815e3852c3d55f978eeda438ff6146c6e22833f8adb1f340e210'}
  - {name: admon/bot, newName: ghcr.io/a1nar-s/advertisiment-monitoring/bot, digest: 'sha256:edcf9fd2d61e418cedcaa98e2bf4a299bee16fc3cf4697158cb73ddb6d64f820'}
  - {name: admon/api, newName: ghcr.io/a1nar-s/advertisiment-monitoring/api, digest: 'sha256:a20a953ea7188eecf370a6825fb52be0f71977c09377b244738225aaeb87101e'}
  - {name: admon/admin, newName: ghcr.io/a1nar-s/advertisiment-monitoring/admin, digest: 'sha256:62319cce507f3d6974a9bf4fc00e1a18f8f0f595eb3ce99424223dfd770cd1aa'}
