# Release: `git tag v1.2.3 && git push origin v1.2.3`. Runs CI on the tagged
# commit; only if all of it passes, builds every service's image, pushes it to GHCR, then commits the digests to the images list in
# deploy/k8s/kustomization.yaml on main. Flux on the node applies that commit
# (deploy/flux), so the cluster runs exactly the digests in git; a rollback is
# a revert of the deploy commit (or pushing an older tag again).
name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

# One release at a time, in order: two at once would race on main.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/a1nar-s/advertisiment-monitoring

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: Image (${{ matrix.service }})
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [scraper, ingest, matcher, notifier, bot, api, admin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            CMD=${{ matrix.service }}
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service }}
      - name: Save the digest
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: $DIGEST"; exit 1; }
          mkdir -p digests && echo "$DIGEST" > "digests/$SERVICE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}
          retention-days: 1

  deploy:
    name: Pin digests on main
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # main, not the tag: the deploy commit goes on top of whatever main is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      # yq is preinstalled on the runner.
      - name: Write the digests into deploy/k8s/kustomization.yaml
        run: |
          for f in digests/*; do
            s=$(basename "$f")
            NAME="admon/$s" NEW="$REGISTRY/$s" DIGEST=$(cat "$f") yq -i '
              (.images[] | select(.name == strenv(NAME))) |=
                (del(.newTag) | .newName = strenv(NEW) | .digest = strenv(DIGEST))
            ' deploy/k8s/kustomization.yaml
            grep -qF "$(cat "$f")" deploy/k8s/kustomization.yaml || { echo "admon/$s is not in the images list"; exit 1; }
          done
          git diff
      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git diff --quiet && { echo "digests already pinned"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Deploy $TAG"
          # main may have moved since the checkout.
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase -q origin main
          done
          exit 1
